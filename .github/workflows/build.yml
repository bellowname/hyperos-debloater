name: build

on:
  push:
  pull_request:
  release:
    types: [published]

# Нужно, чтобы при публикации релиза workflow мог прикрепить zip к нему.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true
        with:
          severity: warning
          scandir: ./module

      - name: Build Magisk zip
        run: sh scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperos-debloater
          path: hyperos-debloater.zip

      - name: Attach zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: hyperos-debloater.zip
